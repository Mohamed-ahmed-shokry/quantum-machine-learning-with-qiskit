[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qml-qiskit"
version = "0.1.0"
description = "Reproducible quantum machine-learning experiments with modern Qiskit primitives"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Mohamed Ahmed Shokry" },
]
keywords = ["qiskit", "quantum-computing", "machine-learning", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=2.0",
  "qiskit>=2.1,<3",
  "qiskit-machine-learning>=0.9,<0.10",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
]
notebooks = [
  "ipykernel>=6",
  "jupyterlab>=4",
  "matplotlib>=3.9",
  "pylatexenc>=2.10",
]
runtime = [
  "qiskit-ibm-runtime>=0.40",
]

[project.scripts]
qml-qiskit = "qml_qiskit.cli:main"

[project.urls]
Homepage = "https://github.com/Mohamed-ahmed-shokry/quantum-machine-learning-with-qiskit"
Repository = "https://github.com/Mohamed-ahmed-shokry/quantum-machine-learning-with-qiskit"
Issues = "https://github.com/Mohamed-ahmed-shokry/quantum-machine-learning-with-qiskit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qml_qiskit"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["qml_qiskit"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
