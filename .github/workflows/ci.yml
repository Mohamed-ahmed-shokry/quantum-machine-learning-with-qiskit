name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint source, tests, and maintained notebooks
        run: python -m ruff check src tests notebooks

      - name: Check source and notebook formatting
        run: python -m ruff format --check src tests notebooks

      - name: Run test suite
        run: python -m pytest --cov --cov-report=term-missing

      - name: Build source and wheel distributions
        run: python -m build
